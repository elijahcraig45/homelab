[defaults]
inventory = inventory.yml
roles_path = roles
stdout_callback = default
result_format = yaml
retry_files_enabled = False
interpreter_python = /usr/bin/python3
# The repo is the source of truth; never let a run silently skip a host.
any_errors_fatal = True

[privilege_escalation]
become = True

[ssh_connection]
pipelining = True
