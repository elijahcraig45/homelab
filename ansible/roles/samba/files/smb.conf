[global]
   workgroup = WORKGROUP
   server string = homelab
   security = user
   map to guest = never
   # Bind to the LAN and the tailnet only - never the docker bridges.
   interfaces = 127.0.0.1/8 eno1
   bind interfaces only = yes
   # SMB1 is dead; macOS and everything else here speak SMB3.
   # Windows 11 24H2 requires SMB signing by default; be explicit rather than
   # relying on the default, and keep SMB2 available in case a client negotiates down.
   server signing = auto
   server min protocol = SMB2_10
   smb encrypt = desired
   # macOS interop. Needed for Time Machine and to stop ._ turd files.
   vfs objects = fruit streams_xattr
   fruit:metadata = stream
   fruit:model = MacSamba
   fruit:posix_rename = yes
   fruit:veto_appledouble = no
   fruit:wipe_intentionally_left_blank_rfork = yes
   fruit:delete_empty_adfiles = yes
   logging = file
   log file = /var/log/samba/log.%m
   max log size = 5000
   log level = 3 auth:5
   log level = 3 auth:5

[files]
   comment = pihome files
   path = /mnt/storage/files
   browseable = yes
   read only = no
   valid users = homelab
   force user = homelab
   force group = homelab
   create mask = 0664
   directory mask = 0775

[timemachine]
   comment = Time Machine
   path = /mnt/storage/timemachine
   browseable = yes
   read only = no
   valid users = homelab
   force user = homelab
   force group = homelab
   # The size cap is the point: without it a Mac backup will grow until it
   # eats the whole pool, because Time Machine fills whatever it is given.
   fruit:time machine = yes
   fruit:time machine max size = 2T
   create mask = 0600
   directory mask = 0700
