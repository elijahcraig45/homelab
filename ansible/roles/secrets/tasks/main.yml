# Secret and per-host files are never in git. Check each one exists with the right owner and mode; when one is
# missing, fail and name the script that creates it. Contents are never read.
- name: Look up secret files
  ansible.builtin.stat:
    path: "{{ item.path }}"
    get_checksum: false
  loop: "{{ secret_files }}"
  loop_control:
    label: "{{ item.path }}"
  register: secret_stats

- name: Check secret files
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - item.stat.pw_name == item.item.owner
      - item.stat.gr_name == item.item.group
      - item.stat.mode == item.item.mode
    fail_msg: >-
      {{ item.item.path }} must exist as {{ item.item.owner }}:{{ item.item.group }} {{ item.item.mode }}
      (found: {{ 'missing' if not item.stat.exists else item.stat.pw_name ~ ':' ~ item.stat.gr_name ~ ' ' ~ item.stat.mode }}).
      Created by: {{ item.item.made_by }}
    quiet: true
  loop: "{{ secret_stats.results }}"
  loop_control:
    label: "{{ item.item.path }}"
