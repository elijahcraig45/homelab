# pihome - plan Phase 8.3
# USB-SATA bridges need an explicit device type; -d sat was confirmed working
# for both ASMedia 174c:55aa bays during the Phase 1 inventory.
#
# Attributes tracked: 5 Reallocated, 187 Reported_Uncorrect, 188 Command_Timeout,
# 197 Current_Pending, 198 Offline_Uncorrectable. Note 188 can be inflated by USB
# bridge resets rather than real drive faults - correlate with dmesg before panicking.
#
# Schedule: short test 02:00 daily, long test 03:00 Sunday. Staggered off the
# nightly appdata snapshot so they never overlap.
DEVICESCAN -d removable -n standby -m root -M exec /usr/share/smartmontools/smartd-runner

/dev/sda -d sat -a -o on -S on -n standby,q -s (S/../.././02|L/../../7/03) -W 4,45,55 -m root -M exec /usr/local/bin/smartd-ntfy
/dev/sdb -d sat -a -o on -S on -n standby,q -s (S/../.././02|L/../../7/03) -W 4,45,55 -m root -M exec /usr/local/bin/smartd-ntfy
