# Tunables for immich-thermal-guard / immich-cpu-profile.  Sourced as shell.
# Installed to /etc/immich-thermal.conf; install.sh will NOT overwrite an
# existing copy, so local edits survive upgrades.
#
# THE ONE KNOB THAT MATTERS: HOT.
# The guard holds the SoC just under HOT by taking CPU away from Immich. It is
# a TEMPERATURE target, not a speed target - lower HOT and the backfill simply
# takes longer, it does not fail. 76 C leaves ~9 C of headroom under the 85 C
# soft limit, which is what "stable" means here: room for a hot day, and the
# fan off its 9,700 rpm ceiling.
HOT=76.0              # trim Immich above this
COOL=70.0             # give CPU back below this (hysteresis band 70-76)
STEP=0.25             # cores added/removed per adjustment
HOT_STREAK_NEEDED=2   # consecutive hot samples (~4 min) before trimming

# Ceilings, not allocations - the guard trims below these whenever it needs to.
# Total is deliberately well under 4 cores: measured host baseline is ~1.3
# cores (tailscaled ~0.44, mergerfs ~0.20, misc ~0.65) before Immich gets any.
DAY_ML=0.6            # day favours immich_server: thumbnails gate every
DAY_SRV=1.2           #   other queue and the UI waits on them
NIGHT_ML=1.2          # night favours ML: grind the backlog unobserved
NIGHT_SRV=0.6

# Floors: low enough that the guard always has somewhere to go. If it reaches
# BOTH and is still hot, that is a cooling/ambient problem and it alerts.
ML_FLOOR=0.25
SRV_FLOOR=0.50

CPUSET="0-2"          # core 3 reserved for host/Samba/Jellyfin
SWAP_WARN_MIB=192     # ntfy below this much free zram
SWAP_CLEAR_MIB=384    # re-arm above this
